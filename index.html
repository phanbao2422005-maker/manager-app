function downloadBlob(filename, data, mime){
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Sheet1');

}

  if(t.dataset.sd){const s=S.find(x=>x.id===t.dataset.sd);if(s&&confirm('Xóa hẳn '+s.n+' khỏi danh sách?\nLịch ca và giờ làm của người này sẽ không còn hiện trong báo cáo. Nếu chỉ nghỉ việc thì nên bấm Nghỉ việc để giữ lịch sử.')){if(S.length<=1)return alert('Phải còn ít nhất 1 nhân sự');await put('cfg','main',{...cfg(),staff:S.filter(x=>x.id!==s.id)});go()}return}
  if(t.dataset.sx){await put('cfg','main',{...cfg(),staff:S.map(s=>s.id===t.dataset.sx?{...s,x:s.x?0:1}:s)});return go()}
  if(t.id==='rsave'){const L=[],g=id=>$('#'+id).value;if(!g('rd'))L.push('Thiếu ngày');[['rt','tổng doanh thu'],['rbl','số bill'],['rc','tiền mặt'],['rb','chuyển khoản']].forEach(([i,n])=>{if(g(i)==='')L.push('Thiếu '+n)});const items=[...document.querySelectorAll('#spl .sp')].map(p=>({r:p.querySelector('.sr').value.trim(),a:+p.querySelector('.sa').value||0,s:p.querySelector('.ss').value})).filter(x=>x.r||x.a);if(items.some(x=>x.a>0&&!x.r))L.push('Mỗi khoản chi phải có lý do');if(items.some(x=>x.r&&!(x.a>0)))L.push('Mỗi khoản chi phải có số tiền');
   if(L.length)return showErr(['Chưa nhập đủ:',...L]);const d=g('rd');await put('revenue',d,{date:d,total:+g('rt'),bills:+g('rbl'),cash:+g('rc'),bank:+g('rb'),spend:items.reduce((a,x)=>a+x.a,0),items});return go()}
  if(t.id==='gsave'){const nh=tab==='nhap',L=[];if(!val('gd'))L.push('Thiếu ngày');if(!gname())L.push('Thiếu tên sản phẩm');if(!(+val('gq')>0))L.push('Thiếu số lượng');if(nh){if(!val('gs'))L.push('Thiếu nhà cung cấp');if(!(+val('ga')>0))L.push('Thiếu số tiền nhập')}else if(!val('gr'))L.push('Thiếu lý do hủy');
   if(L.length)return showErr(['Chưa nhập đủ:',...L]);await put('goods',Date.now().toString(36),{type:tab,date:val('gd'),name:gname(),grp:$('#gg').value,qty:+val('gq'),unit:$('#gu').value,status:'Chưa nhập',...(nh?{supplier:val('gs'),amount:+val('ga')}:{reason:val('gr')})});return go()}
  if(t.id==='vsave'){if(!val('vd'))return showErr(['Thiếu ngày']);await put('viol',Date.now().toString(36),{date:val('vd'),name:$('#vn').value,err:$('#ve').value,note:val('vt')});return go()}
});

document.addEventListener('input',e=>{const p=e.target.nextElementSibling;if(p&&p.classList.contains('pv'))p.textContent=e.target.value?vnd(e.target.value):''});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#spl'))spTot()});
let dragId=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('tr[data-sr]');if(r){dragId=r.dataset.sr;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('tr[data-sr]'))e.preventDefault()});
document.addEventListener('drop',async e=>{const r=e.target.closest&&e.target.closest('tr[data-sr]');if(!r||!dragId||r.dataset.sr===dragId)return;e.preventDefault();const a=S.slice(),f=a.findIndex(x=>x.id===dragId),ti=a.findIndex(x=>x.id===r.dataset.sr),[m]=a.splice(f,1);a.splice(ti,0,m);dragId=null;await put('cfg','main',{...cfg(),staff:a});go()});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='mo'||t.id==='mt'){month=t.value||month;go()}
 if(t.dataset.al){await put('cfg','main',{...cfg(),acct:acct().map(a=>a.id===t.dataset.al?{...a,l:t.value.trim()}:a)});go()}
 if(t.id==='wk'){week=mon(t.value);go()}
 if(t.id==='gg'){$('#gn').innerHTML=prodOpts(t.value);$('#gk').style.display=$('#gn').value==='__k'?'block':'none'}
 if(t.id==='gn'){$('#gk').style.display=t.value==='__k'?'block':'none';const m=t.value.match(/\((KG|HỘP|CHAI|BỊCH)/);if(m)$('#gu').value={KG:'kg','HỘP':'hộp',CHAI:'chai','BỊCH':'bịch'}[m[1]]}
 if(t.dataset.ti){const[i,k]=t.dataset.ti.split('|'),p=t.parentElement.querySelectorAll('input'),c={...(D.sched[week]?.cells||{})};c[S[+i].id+'_'+k+'x']=p[0].value+' - '+p[1].value;await put('sched',week,{cells:c});go()}
 if(t.dataset.sf){const[id,f]=t.dataset.sf.split('|');await put('cfg','main',{...cfg(),staff:S.map(s=>s.id===id?{...s,[f]:t.value.trim()}:s)});go()}
 if(t.id==='ck'){const c=cfg();await put('cfg','main',{...c,kpi:+t.value||0});go()}
 if(t.dataset.dn){const c=cfg(),[k,w]=t.dataset.dn.split('|'),a=[...(c.dinh[k]||Array(7).fill(0))];a[+w]=Math.max(0,+t.value||0);await put('cfg','main',{...c,dinh:{...c.dinh,[k]:a}});go()}
 if(t.dataset.i!==undefined){const c={...(D.sched[week]?.cells||{})};c[S[+t.dataset.i].id+'_'+t.dataset.k]=t.value.trim();await put('sched',week,{cells:c});go()}
});

let listenersStarted = false;
auth.onAuthStateChanged(async user => {
  if(!user){
    meId = null;
    $('#auth-gate').style.display = 'block';
    $('#main-app').style.display = 'none';
    $('#user-panel').innerHTML = '';
    $('#st').textContent = 'Vui lòng đăng nhập để dùng hệ thống.';
    return;
  }
  meId = user.uid;
  meEmail = (user.email || '').toLowerCase();
  meName = user.displayName || meEmail || user.uid;
  PROF[meId] = {name: meName};

  // Nếu chưa có ai là chủ quán trong cfg.main.ownerUid, người đầu tiên đăng nhập có email khớp OWNER_EMAILS hoặc chưa có owner sẽ tự nhận quyền chủ quán
  const mainDoc = await db.collection('cfg').doc('main').get();
  const mainData = mainDoc.exists ? mainDoc.data() : {};
  if(OWNER_EMAILS.map(x=>x.toLowerCase()).includes(meEmail)){
    mgr = true;
    if(mainData.ownerUid !== meId){
      await db.collection('cfg').doc('main').set({...mainData, ownerUid: meId}, {merge: true});
    }
  } else if(!mainData.ownerUid && !OWNER_EMAILS.length){
    mgr = true;
    await db.collection('cfg').doc('main').set({...mainData, ownerUid: meId}, {merge: true});
  } else {
    mgr = (mainData.ownerUid === meId);
  }

  $('#auth-gate').style.display = 'none';
  $('#main-app').style.display = 'block';
  $('#user-panel').innerHTML = `<span class="sub">${esc(meName)}</span> <button class="btn s g" id="btn-logout">Đăng xuất</button>`;

  if(!listenersStarted){
    listenersStarted = true;
    ['revenue','goods','sched','viol','cfg','req'].forEach(c=>{
      db.collection(c).onSnapshot(s=>{
        D[c]={};
        s.docs.forEach(d=>D[c][d.id]=d.data());
        syncS();
        if(c==='cfg'&&D.cfg.main?.ownerUid===meId)mgr=true;
        if(c==='cfg'&&!mgr&&meId&&!reqSent&&!acct().some(a=>a.id===meId)){
          reqSent=1;
          db.collection('req').doc(meId).set({t:Date.now(),name:meName,email:meEmail}).catch(()=>{});
        }
        $('#st').textContent='Dữ liệu dùng chung, mọi người thấy dữ liệu của nhau trực tiếp. '+(mgr?'Bạn có quyền quản lý (xác nhận, xóa, cài đặt).':'Bạn đang ở chế độ phân quyền tài khoản.');
        draw();
      });
    });
  }
  draw(true);
});
</script></body></html>
